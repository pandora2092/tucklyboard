name: tuckly

x-api: &api-image
  image: tuckly-api:local
  build:
    context: .
    target: api

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tuckly
      POSTGRES_DB: tuckly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tuckly -d tuckly']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *api-image
    working_dir: /app
    command:
      ['node_modules/.bin/prisma', 'migrate', 'deploy', '--schema', 'apps/api/prisma/schema.prisma']
    environment:
      DATABASE_URL: postgresql://tuckly:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/tuckly
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-image
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEV_AUTH: 'false'
      HTTP_HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_URL: postgresql://tuckly:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/tuckly
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env.production}
      BOT_USERNAME: ${BOT_USERNAME:-}
      BOT_POLLING: ${BOT_POLLING:-true}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:?Set ADMIN_TELEGRAM_IDS in .env.production}
      MINI_APP_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}
      WEB_ORIGIN: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}
      ENRICHMENT_ENABLED: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
